
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <div class="weather-card">
        <h1>🌤 Weather App</h1>
        <p>Check the weather in any city</p>

        <form id="searchForm" class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
                aria-label="City name"
                required
            >
            <button type="submit" id="searchBtn">Search</button>
        </form>

        <p id="message" role="status">Search for a city to see its weather.</p>

        <div id="weatherResult" class="hidden">
            <h2 id="cityName"></h2>

            <div id="weatherIcon" class="weather-icon">🌤️</div>

            <p id="description" class="description"></p>
            <p id="temperature" class="temperature"></p>

            <div class="details">
                <div class="detail-box">
                    <p>🌡️ Feels like</p>
                    <strong id="feelsLike"></strong>
                </div>

                <div class="detail-box">
                    <p>💧 Humidity</p>
                    <strong id="humidity"></strong>
                </div>

                <div class="detail-box">
                    <p>💨 Wind speed</p>
                    <strong id="wind"></strong>
                </div>

                <div class="detail-box">
                    <p>🌧️ Precipitation</p>
                    <strong id="rain"></strong>
                </div>
            </div>
        </div>

        <p class="credit">
            Weather data by Open-Meteo
        </p>
    </div>

    <script>
        const searchForm = document.querySelector("#searchForm");
        const cityInput = document.querySelector("#cityInput");
        const searchBtn = document.querySelector("#searchBtn");
        const message = document.querySelector("#message");
        const weatherResult = document.querySelector("#weatherResult");

        // Convert weather codes into descriptions and icons
        function getWeatherInfo(code, isDay) {
            if (code === 0) {
                return {
                    description: "Clear sky",
                    icon: isDay ? "☀️" : "🌙"
                };
            }

            if (code === 1 || code === 2) {
                return {
                    description: "Mainly clear / Partly cloudy",
                    icon: isDay ? "🌤️" : "☁️"
                };
            }

            if (code === 3) {
                return {
                    description: "Overcast",
                    icon: "☁️"
                };
            }

            if ([45, 48].includes(code)) {
                return {
                    description: "Foggy",
                    icon: "🌫️"
                };
            }

            if ([51, 53, 55, 56, 57].includes(code)) {
                return {
                    description: "Drizzle",
                    icon: "🌦️"
                };
            }

            if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) {
                return {
                    description: "Rain",
                    icon: "🌧️"
                };
            }

            if ([71, 73, 75, 77, 85, 86].includes(code)) {
                return {
                    description: "Snow",
                    icon: "❄️"
                };
            }

            if ([95, 96, 99].includes(code)) {
                return {
                    description: "Thunderstorm",
                    icon: "⛈️"
                };
            }

            return {
                description: "Unknown conditions",
                icon: "🌡️"
            };
        }

        async function getWeather(city) {
            searchBtn.disabled = true;
            searchBtn.textContent = "Loading...";
            message.textContent = "Searching for weather...";
            weatherResult.classList.add("hidden");

            try {
                // Step 1: Find the city's coordinates
                const geoURL =
                    "https://geocoding-api.open-meteo.com/v1/search" +
                    "?name=" + encodeURIComponent(city) +
                    "&count=1&language=en&format=json";

                const geoResponse = await fetch(geoURL);

                if (!geoResponse.ok) {
                    throw new Error("Could not search for the city.");
                }

                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    message.textContent =
                        "City not found. Please check the spelling.";
                    return;
                }

                const place = geoData.results[0];

                // Step 2: Get weather using latitude and longitude
                const weatherURL =
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=" + place.latitude +
                    "&longitude=" + place.longitude +
                    "&current=temperature_2m,relative_humidity_2m," +
                    "apparent_temperature,is_day,precipitation," +
                    "weather_code,wind_speed_10m" +
                    "&timezone=auto";

                const weatherResponse = await fetch(weatherURL);

                if (!weatherResponse.ok) {
                    throw new Error("Could not retrieve weather data.");
                }

                const weatherData = await weatherResponse.json();
                const current = weatherData.current;

                if (!current) {
                    throw new Error("Weather data is unavailable.");
                }

                // Step 3: Display the results
                const info = getWeatherInfo(
                    current.weather_code,
                    current.is_day
                );

                const location = [
                    place.name,
                    place.admin1,
                    place.country
                ].filter(Boolean).filter(
                    (value, index, array) => array.indexOf(value) === index
                ).join(", ");

                document.querySelector("#cityName").textContent = location;

                document.querySelector("#weatherIcon").textContent =
                    info.icon;

                document.querySelector("#description").textContent =
                    info.description;

                document.querySelector("#temperature").textContent =
                    Math.round(current.temperature_2m) + " °C";

                document.querySelector("#feelsLike").textContent =
                    current.apparent_temperature + " °C";

                document.querySelector("#humidity").textContent =
                    current.relative_humidity_2m + "%";

                document.querySelector("#wind").textContent =
                    current.wind_speed_10m + " km/h";

                document.querySelector("#rain").textContent =
                    current.precipitation + " mm";

                weatherResult.classList.remove("hidden");
                message.textContent =
                    "Current weather · " + current.time.replace("T", " ");

            } catch (error) {
                console.error(error);
                message.textContent =
                    "Unable to load weather. Check your internet connection and try again.";
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = "Search";
            }
        }

        // Search when the form is submitted
        searchForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const city = cityInput.value.trim();

            if (city !== "") {
                getWeather(city);
            }
        });
    </script>

</body>
</html>
