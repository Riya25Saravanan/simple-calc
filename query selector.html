<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: aliceblue; display: flex; align-items: center; justify-content: center;">
  <div style="display: flex; padding: 10px; border-radius: 10px; background-color: rgb(255, 218, 237); text-align: center; align-items: center; margin: 7%;">
    <div>
<h1> Welcome to javascript</h1>
    
    
        <h3 class="message"> Please click the button!</h3>
    
        <button id="button" > Click me !</button>
    
  </div>

    <script>

const message = document.querySelector(".message")
const button = document.querySelector("#button")

button.addEventListener("click", function(){
    message.textContent= "You clicked the button!";
});
button.addEventListener("click", function(){
    button.textContent= "Clicked!";
});

    </script>
</body>
</html>
